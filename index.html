<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="雲林計程車">
<link rel="manifest" href="manifest.json"><title>雲林計程車營業紀錄 V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}header{padding:20px 4px 12px}h1{font-size:23px;margin:0}h2{font-size:25px;margin:8px 0 14px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000008}.stat{display:flex;gap:12px}.stat>div{flex:1;background:#f9fafb;border-radius:16px;padding:15px}.big{font-size:30px;font-weight:800}.label,.small{color:#6b7280}.small{font-size:14px;line-height:1.6}button{border:0;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:700;width:100%;margin-top:10px}.primary{background:#111827;color:#fff}.green{background:#047857;color:#fff}.light{background:#eef2f7;color:#111827}.voice{min-height:130px;font-size:25px;background:#111827;color:#fff;border-radius:24px}.voice.listening{background:#b91c1c}input{width:100%;padding:15px;border:1px solid #e5e7eb;border-radius:14px;font-size:18px;margin-top:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb}.amount{font-weight:800}.hidden{display:none!important}.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:5px 10px;font-size:13px}.history-item{padding:13px 0;border-bottom:1px solid #e5e7eb}
</style></head><body><div class="app">
<header><h1>🚕 雲林計程車</h1></header>

<section id="home" class="screen"><div class="card"><div class="stat"><div><div class="label">今日趟數</div><div id="todayTrips" class="big">0</div></div><div><div class="label">今日營收</div><div id="todayIncome" class="big">$0</div></div></div></div>
<div class="card"><h3>今天開始營業</h3><p class="small">請從 HTTPS 網址開啟，第一次使用語音請允許麥克風與語音辨識。</p><button class="primary" onclick="startTrip()">🎙️ 新增一趟</button><button class="light" onclick="showHistory()">📒 歷史紀錄</button></div></section>

<section id="pickup" class="screen hidden"><div class="card"><span class="badge">① 接客</span><h2>輸入接客地點</h2><button id="pickupVoice" class="voice" onclick="voice('pickup')">🎙️ 說出接客地點</button>
<button class="light" type="button" onclick="pickupGroupLandmarkNext()">📍 群組地標</button><input id="pickupInput" placeholder="例如：斗六火車站"><button class="light" onclick="confirmPickup()">確認接客地點</button></div></section>
<section id="pickupConfirm" class="screen hidden"><div class="card"><span class="badge">① 接客</span><h2>接客地點確認</h2><div id="pickupText" class="big"></div><button class="green" onclick="navigatePickup()">🗺️ 前往接客</button><button class="light" onclick="backTo('pickup')">重新輸入</button></div></section>

<section id="destination" class="screen hidden"><div class="card"><span class="badge">② 上車後</span><h2>輸入目的地</h2><p class="small">例如：虎尾鎮林森路二段五百號</p><button id="destVoice" class="voice" onclick="voice('destination')">🎙️ 輸入目的地</button>
<button class="light" type="button" onclick="destinationGroupLandmarkNext()">📍 群組地標</button><input id="destInput" placeholder="也可以手動輸入"><button class="light" onclick="confirmDestination()">確認目的地</button></div></section>
<section id="destinationConfirm" class="screen hidden"><div class="card"><span class="badge">② 目的地</span><h2>目的地確認</h2><div id="destText" class="big"></div><p id="destHint" class="small"></p><button class="green" onclick="navigateDestination()">🗺️ 開始導航</button><button class="light" onclick="backTo('destination')">重新輸入</button></div></section>

<section id="payment" class="screen hidden"><div class="card"><span class="badge">③ 抵達後</span><h2>輸入車資</h2><p class="small">例如：「車資五百，小費五十」。沒有小費時自動記 $0。</p><button id="payVoice" class="voice" onclick="voice('payment')">🎙️ 輸入車資與小費</button><input id="paymentInput" placeholder="例如：車資五百，小費五十"><button class="light" onclick="confirmPayment()">確認金額</button></div></section>

<section id="review" class="screen hidden"><div class="card"><span class="badge">④ 最後確認</span><h2>本趟資料</h2><div class="row"><span>接客地點</span><b id="reviewPickup"></b></div><div class="row"><span>目的地</span><b id="reviewDest"></b></div><div class="row"><span>車資</span><b id="reviewFare"></b></div><div class="row"><span>小費</span><b id="reviewTip"></b></div><div class="row"><span>本趟合計</span><b id="reviewTotal" class="amount"></b></div><button class="green" onclick="completeTrip()">✅ 完成本趟</button><button class="light" onclick="backTo('payment')">重新輸入車資</button></div></section>

<section id="history" class="screen hidden"><div class="card"><h2>📒 歷史紀錄</h2><div id="historyList"></div><button class="light" onclick="showHome()">回首頁</button></div></section>
</div>
<script>
const DB='YunlinTaxiV2',STORE='trips';let db,current={};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function allTrips(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function addTrip(x){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).add(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function screen(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));
  const el=document.getElementById(id);
  if(el) el.classList.remove('hidden');
  try { localStorage.setItem('yunlinTaxiScreen', id); } catch(e) {}
  scrollTo(0,0);
}
function backTo(id){screen(id)} function startTrip(){current={};screen('pickup')} function showHome(){screen('home');refreshHome()} function showHistory(){screen('history');renderHistory()}
const towns=['斗六市','斗南鎮','虎尾鎮','西螺鎮','土庫鎮','北港鎮','古坑鄉','大埤鄉','莿桐鄉','林內鄉','二崙鄉','崙背鄉','麥寮鄉','東勢鄉','褒忠鄉','臺西鄉','元長鄉','四湖鄉','口湖鄉','水林鄉'];
function cnNum(s){if(/^\d+$/.test(s))return s;let d={零:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9},t=0,n=0;for(let c of s){if(d[c]!==undefined)n=d[c];else if(c==='十'){t+=(n||1)*10;n=0}else if(c==='百'){t+=(n||1)*100;n=0}else if(c==='千'){t+=(n||1)*1000;n=0}}return String(t+n)}
function normalize(s){s=s.trim().replace(/台/g,'臺').replace(/[，,。．]/g,' ').replace(/\s+/g,' ');s=s.replace(/([零一二兩三四五六七八九十百千\d]+)號/g,(_,n)=>cnNum(n)+'號');let t=towns.find(x=>s.includes(x));if(t&&!s.includes('雲林縣'))s='雲林縣'+s;return s}
function voice(type){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('目前瀏覽器沒有可用的語音辨識。請用最新版 iPhone Safari，並從 HTTPS 網址開啟。');return}let b=document.getElementById(type==='pickup'?'pickupVoice':type==='destination'?'destVoice':'payVoice'),r=new SR();r.lang='zh-TW';r.continuous=false;r.interimResults=true;b.classList.add('listening');b.textContent='🔴 正在聽，請說話…';r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;if(type==='pickup')pickupInput.value=s;if(type==='destination')destInput.value=s;if(type==='payment')paymentInput.value=s};r.onerror=e=>{b.classList.remove('listening');b.textContent='🎙️ 再試一次';alert('語音辨識失敗：'+e.error)};r.onend=()=>{b.classList.remove('listening');b.textContent=type==='pickup'?'🎙️ 說出接客地點':type==='destination'?'🎙️ 輸入目的地':'🎙️ 輸入車資與小費'};try{r.start()}catch(e){alert('請再按一次語音按鈕')}}
function confirmPickup(){let r=pickupInput.value.trim();if(!r)return alert('請先說出或輸入接客地點');current.pickup=normalize(r);pickupText.textContent=current.pickup;screen('pickupConfirm')}
function confirmDestination(){let r=destInput.value.trim();if(!r)return alert('請先輸入目的地');current.destination=normalize(r);destText.textContent=current.destination;destHint.textContent=current.destination.includes('雲林縣')?'已自動補上雲林縣。':'請確認地名是否正確。';screen('destinationConfirm')}
function maps(d,o=''){let u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d)+'&travelmode=driving';if(o)u+='&origin='+encodeURIComponent(o);return u}

function saveCurrentTripState() {
  try { localStorage.setItem('yunlinTaxiCurrentTrip', JSON.stringify(current)); } catch(e) {}
}
function restoreCurrentTripState() {
  try {
    const raw = localStorage.getItem('yunlinTaxiCurrentTrip');
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved && saved.step) { current = saved; render(); return true; }
    }
  } catch(e) {}
  return false;
}
function clearCurrentTripState() {
  try { localStorage.removeItem('yunlinTaxiCurrentTrip'); } catch(e) {}
}


function pickupGroupLandmarkNext(){ current.pickup='群組地標'; screen('destination'); }

function groupLandmarkNext(){ current.pickup='群組地標'; screen('destination'); }
function destinationGroupLandmarkNext(){ current.destination='群組地標'; screen('payment'); }
function navigatePickup(){
  saveCurrentTripState();location.href=maps(current.pickup)} function navigateDestination(){
  saveCurrentTripState();location.href=maps(current.destination,current.pickup)}
function money(n){return '$'+Number(n).toLocaleString('zh-TW')}
function parseMoney(s){let pat='零一二兩三四五六七八九十百千',f=0,t=0;function get(x){return cnNum(x)}let fm=s.match(new RegExp('車資\\s*([0-9'+pat+']+)')),tm=s.match(new RegExp('小費\\s*([0-9'+pat+']+)'));if(fm)f=+get(fm[1]);if(tm)t=+get(tm[1]);if(!fm){let ns=[...s.matchAll(new RegExp('([0-9'+pat+']+)','g'))].map(x=>+get(x[1])).filter(Boolean);f=ns[0]||0;if(!tm)t=ns[1]||0}return{fare:f,tip:t}}
function confirmPayment(){let r=paymentInput.value.trim(),p=parseMoney(r);if(!r||!p.fare)return alert('請說例如：「車資五百，小費五十」');current.fare=p.fare;current.tip=p.tip;reviewPickup.textContent=current.pickup;reviewDest.textContent=current.destination;reviewFare.textContent=money(p.fare);reviewTip.textContent=money(p.tip);reviewTotal.textContent=money(p.fare+p.tip);screen('review')}
async function completeTrip(){let now=Date.now();await addTrip({timestamp:now,pickup:current.pickup,destination:current.destination,fare:current.fare,tip:current.tip,total:current.fare+current.tip});alert('本趟已完成並正式記入帳本！');showHome()}
async function refreshHome(){let a=await allTrips(),d=new Date(),t=a.filter(x=>{let z=new Date(x.timestamp);return z.toDateString()===d.toDateString()});todayTrips.textContent=t.length;todayIncome.textContent=money(t.reduce((s,x)=>s+x.total,0))}
async function renderHistory(){let a=(await allTrips()).sort((x,y)=>y.timestamp-x.timestamp);historyList.innerHTML=a.length?'':'<p class="small">目前沒有完成的趟次。</p>';a.forEach(x=>{let d=new Date(x.timestamp),tm=d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});historyList.insertAdjacentHTML('beforeend',`<div class="history-item"><b>${tm}</b><br>${esc(x.pickup)} → ${esc(x.destination)}<br><span class="small">車資 ${money(x.fare)}　小費 ${money(x.tip)}　合計 <b>${money(x.total)}</b></span></div>`)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
openDB().then(refreshHome);
</script></body></html>
<script>window.addEventListener("pageshow", function(){ try { var id=localStorage.getItem("yunlinTaxiScreen"); if(id && document.getElementById(id)) screen(id); } catch(e) {} });</script>
